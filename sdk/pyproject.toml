[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-sdk"
version = "2.5.0"
description = "Python SDK and CLI for Echo Agent Governance"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Echo Team" }]
requires-python = ">=3.9"
keywords = ["agent", "governance", "llm", "ai", "compliance", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25,<1.0",
]

[project.optional-dependencies]
async = ["anyio>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/xxx0438/e-cho"
Repository = "https://github.com/xxx0438/e-cho"
Issues = "https://github.com/xxx0438/e-cho/issues"

[project.scripts]
echo = "echo_sdk.cli:main"
echo-cli = "echo_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["echo_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
