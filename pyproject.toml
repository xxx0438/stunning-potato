[project]
name = "echo-agent-governance"
version = "2.3.0"
description = "Single-file Agent governance platform (assets, versions, CI gate, runtime guardrails, evaluations, audit)."
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL", "RUF"]
ignore = ["E501", "PLR0913", "PLR0912", "PLR0915", "PLR2004", "B008"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
